<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13m0 0-3.5-3.5M17 8l-3.5 3.5M20 16H7m0 0 3.5-3.5M7 16l3.5 3.5"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="i-gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v2.5M12 19.5V22M22 12h-2.5M4.5 12H2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-candle" viewBox="0 0 24 24"><path d="M9 21h6M12 21v-3M9 18h6v-7a3 3 0 0 0-6 0z"/><path d="M12 8V5c0-1 1-1.5 1-2.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 4.5h5.2l-2.6 4.5 2.6 4.5h-5.2L12 21l-2.6-4.5H4.2l2.6-4.5-2.6-4.5h5.2z"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V4h12v5M6 18H4v-6h16v6h-2M8 14h8v6H8z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v13M12 3 8 7M12 3l4 4M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
</svg>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="loc-btn" id="btn-loc" title="מיקום"><svg><use href="#i-pin"/></svg><span id="topbar-loc"></span></button>
      <h1 id="page-title">לוח</h1>
      <button class="icon-btn" id="act-print" title="הדפסת החודש"><svg><use href="#i-print"/></svg></button>
      <button class="pill" id="btn-jump">היום</button>
    </div>
  </header>

  <main>
    <!-- לוח שנה -->
    <section class="view active" id="view-cal">
      <div class="month-nav">
        <button id="m-prev" aria-label="חודש קודם"><svg><use href="#i-next"/></svg></button>
        <div class="month-title" id="month-title"></div>
        <button id="m-next" aria-label="חודש הבא"><svg><use href="#i-prev"/></svg></button>
      </div>
      <div class="weekdays"><div>א׳</div><div>ב׳</div><div>ג׳</div><div>ד׳</div><div>ה׳</div><div>ו׳</div><div>שבת</div></div>
      <div class="grid" id="grid"></div>
      <div class="daycard" id="daycard"></div>
    </section>

    <!-- זמני היום -->
    <section class="view scroll" id="view-zman">
      <div class="hero">
        <div class="date-nav">
          <button id="z-prev" aria-label="יום קודם"><svg><use href="#i-next"/></svg></button>
          <div class="dt" id="z-date"></div>
          <button id="z-next" aria-label="יום הבא"><svg><use href="#i-prev"/></svg></button>
        </div>
        <div class="pair">
          <div class="box"><div class="k"><svg><use href="#i-sun"/></svg>הנץ החמה</div><div class="v" id="z-sunrise">--:--</div></div>
          <div class="box"><div class="k"><svg><use href="#i-moon"/></svg>שקיעה</div><div class="v" id="z-sunset">--:--</div></div>
        </div>
      </div>
      <div class="countdown" id="z-countdown"></div>
      <button class="loc-chip" id="z-loc">
        <svg><use href="#i-pin"/></svg><span class="name"></span><span class="act">שינוי</span>
      </button>
      <div id="z-groups"></div>
      <div class="foot">כל הזמנים מחושבים במכשיר שלך לפי מיקום גאוגרפי. יש לנהוג לחומרא בכמה דקות בכל זמן.</div>
    </section>

    <!-- ממיר תאריכים -->
    <section class="view scroll" id="view-conv">
      <div class="card">
        <div class="field">
          <label>תאריך לועזי</label>
          <input type="date" id="conv-greg">
        </div>
        <div class="field">
          <label>תאריך עברי</label>
          <div class="controls">
            <select id="conv-hd"></select>
            <select id="conv-hm"></select>
            <select id="conv-hy"></select>
          </div>
        </div>
      </div>
      <div class="card"><div class="result" id="conv-result"></div></div>
      <div class="section-title">התאריך העברי בשנים הבאות</div>
      <div class="card"><div class="list" id="conv-years"></div></div>
    </section>

    <!-- הגדרות -->
    <section class="view scroll" id="view-set">
      <div class="section-title">מיקום</div>
      <div class="card">
        <button class="setting" id="set-loc" style="width:100%;text-align:start">
          <div class="txt"><div class="t" id="set-loc-name"></div><div class="s" id="set-loc-sub"></div></div>
          <svg class="icon-btn" style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8"><use href="#i-prev"/></svg>
        </button>
        <button class="setting" id="set-gps" style="width:100%;text-align:start">
          <div class="txt"><div class="t">איתור אוטומטי</div><div class="s">שימוש ב־GPS של המכשיר</div></div>
          <svg class="icon-btn" style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8"><use href="#i-gps"/></svg>
        </button>
      </div>

      <div class="section-title">שיטות חישוב</div>
      <div class="card" id="set-methods"></div>

      <div class="section-title">תצוגה</div>
      <div class="card" id="set-display"></div>

      <div class="foot" id="about"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="cal" class="active"><svg><use href="#i-cal"/></svg>לוח שנה</button>
    <button data-view="zman"><svg><use href="#i-clock"/></svg>זמני היום</button>
    <button data-view="conv"><svg><use href="#i-swap"/></svg>ממיר</button>
    <button data-view="set"><svg><use href="#i-cog"/></svg>הגדרות</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet">
  <div class="sheet-bg" data-close></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="close" data-close>סגירה</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="print-area"></div>

<script src="js/hdate.js"></script>
<script src="js/zmanim.js"></script>
<script src="js/holidays.js"></script>
<script src="js/cities.js"></script>
<script src="js/app.js"></script>
</body>
</html>

# מייצר מחדש את הדפים הסטטיים (zmanim/, chagim/, sitemap.xml) פעם בשבוע,
# במוצאי שבת לפי שעון ישראל, כדי שהזמנים והתאריכים בהם יישארו עדכניים.
name: Static pages

on:
  schedule:
    - cron: '17 22 * * 6'   # שבת 22:17 UTC = ראשון 00:17–01:17 בישראל
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/build-pages.js
      - name: Commit
        run: |
          if git diff --quiet; then echo "אין שינויים"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add zmanim chagim parasha chametz sitemap.xml
          git commit -m "עדכון שבועי של הדפים הסטטיים"
          git push
          # דחיפה בשם GITHUB_TOKEN לא תמיד מפעילה בנייה של GitHub Pages — מבקשים אותה במפורש
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
